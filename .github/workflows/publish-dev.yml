name: Build, check and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MementoMori.WebUI/MementoMori.WebUI.csproj -c Release
      - run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj -c Release
      - run: dotnet build MementoMori.AssetDownloader/MementoMori.AssetDownloader.csproj -c Release
      - run: docker build -f MementoMori.WebUI/Dockerfile -t mementomori-webui:check .

  publish-docker:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: MementoMori.WebUI/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-desktop:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_RID: ${{ matrix.rid }}
        run: dotnet publish MementoMori.WebUI/MementoMori.WebUI.csproj -c Release -r "$TARGET_RID" -o "publish-$TARGET_RID" --self-contained -p:Version="${RELEASE_TAG#v}" -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true
      - name: Archive
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: zip -qr "publish-$TARGET_RID.zip" "publish-$TARGET_RID"
      - uses: softprops/action-gh-release@v2
        with:
          files: publish-${{ matrix.rid }}.zip
