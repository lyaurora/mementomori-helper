services:
  mementomori:
    build:
      context: ../..
      dockerfile: MementoMori.WebUI/Dockerfile
    image: mementomori-webui:local
    container_name: mementomori
    restart: unless-stopped
    pull_policy: never
    ports:
      - "127.0.0.1:5290:8080"
    environment:
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      ConfigDirectory: /app/config
    volumes:
      - ./Master:/app/Master
      - ./BattleLogs:/app/BattleLogs
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
